name: Publish approved wStream APK
on:
  push:
    branches: [main]
    paths: ['.github/update-release.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-wstream-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify approved update bundle
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request, zipfile
          config=json.loads(pathlib.Path('.github/update-release.json').read_text())
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'wstream-release'
          target.mkdir()
          request=urllib.request.Request(config['artifactUrl'])
          with urllib.request.urlopen(request, timeout=60) as response:
              archive=response.read(30*1024*1024+1)
          assert len(archive)<=30*1024*1024
          (target/'bundle.zip').write_bytes(archive)
          with zipfile.ZipFile(target/'bundle.zip') as z:
              apk=z.read('wstream.apk')
              manifest=json.loads(z.read('latest.json'))
          assert hashlib.sha256(apk).hexdigest()==config['sha256']==manifest['sha256']
          assert len(apk)==manifest['size']
          assert manifest['versionCode']==config['versionCode']
          tag=f"v{manifest['versionName']}-{manifest['versionCode']}"
          assert re.fullmatch(r'[A-Za-z0-9._-]+',tag)
          assert manifest['downloadUrl']==f'https://github.com/waterkrow/wstream-play/releases/download/{tag}/wstream.apk'
          (target/'wstream.apk').write_bytes(apk)
          (target/'latest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          (target/'notes.md').write_text(manifest.get('notes',''))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'RELEASE_TAG={tag}\nRELEASE_DIR={target}\n')
          print(f"Verified {tag}: {len(apk)} bytes")
          PY
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_DIR/wstream.apk" "$RELEASE_DIR/latest.json" --title "wStream $RELEASE_TAG" --notes-file "$RELEASE_DIR/notes.md" --target main
