<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <title>wStream</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#090d14;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:flex;align-items:center;justify-content:center;padding:28px}
    main{width:min(560px,100%);text-align:center}
    .logo{width:78px;height:78px;margin:0 auto 24px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#78d5b2,#3d8f78);box-shadow:0 18px 48px rgba(58,174,137,.22);font-size:42px;font-weight:800;color:#07120f}
    h1{margin:0 0 12px;font-size:clamp(32px,7vw,48px);letter-spacing:-1px}
    p{margin:0;color:#aeb9c8;font-size:clamp(16px,3vw,20px);line-height:1.6}
    .state{margin:34px auto 0;padding:20px;border:1px solid rgba(255,255,255,.11);border-radius:18px;background:rgba(255,255,255,.055)}
    .row{display:flex;align-items:center;justify-content:center;gap:13px}
    .spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.18);border-top-color:#78d5b2;border-radius:50%;animation:spin .8s linear infinite}
    #status{font-size:18px;font-weight:650}
    #detail{display:block;margin-top:9px;color:#8390a1;font-size:14px}
    button{margin-top:26px;padding:13px 30px;border:0;border-radius:999px;background:#78d5b2;color:#07120f;font-size:16px;font-weight:800;cursor:pointer}
    footer{margin-top:28px;color:#657184;font-size:13px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="logo">W</div>
    <h1>wStream</h1>
    <p>휴대폰 핫스팟 연결과<br>wStream 실행 상태를 확인하고 있습니다.</p>
    <section class="state">
      <div class="row"><span class="spinner" id="spinner"></span><span id="status">휴대폰 연결 대기 중…</span></div>
      <span id="detail">잠시 후 자동으로 다시 확인합니다.</span>
    </section>
    <button id="retry" type="button">지금 다시 확인</button>
    <footer>안전한 곳에 정차한 상태에서 사용하세요.</footer>
  </main>
  <script>
    (function () {
      var TARGET_HOST = "wstream.ddnsfree.com:34752";
      var TARGET_WS = "wss://" + TARGET_HOST + "/ws";
      var TARGET_PAGE = "https://" + TARGET_HOST + "/";
      var RETRY_MS = 2000;
      var TIMEOUT_MS = 3500;
      var status = document.getElementById("status");
      var detail = document.getElementById("detail");
      var spinner = document.getElementById("spinner");
      var retryButton = document.getElementById("retry");
      var retryTimer = 0;
      var socket = null;
      var attempt = 0;

      function schedule() {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(probe, RETRY_MS);
      }

      function probe() {
        clearTimeout(retryTimer);
        if (socket) {
          try { socket.close(); } catch (_) {}
          socket = null;
        }
        attempt += 1;
        status.textContent = "휴대폰 연결 대기 중…";
        detail.textContent = "연결 확인 " + attempt + "회 · 자동 재시도 중";
        spinner.style.display = "block";

        var ws;
        var finished = false;
        var timeout;
        try {
          ws = new WebSocket(TARGET_WS);
          socket = ws;
        } catch (_) {
          schedule();
          return;
        }

        timeout = setTimeout(function () {
          if (finished) return;
          finished = true;
          try { ws.close(); } catch (_) {}
          if (socket === ws) socket = null;
          detail.textContent = "핫스팟과 wStream 실행 상태를 확인하세요.";
          schedule();
        }, TIMEOUT_MS);

        ws.onopen = function () {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          status.textContent = "연결되었습니다";
          detail.textContent = "wStream 화면으로 이동합니다.";
          spinner.style.display = "none";
          try { ws.close(1000, "open wStream"); } catch (_) {}
          if (socket === ws) socket = null;
          setTimeout(function () { location.replace(TARGET_PAGE); }, 250);
        };

        ws.onerror = function () {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          if (socket === ws) socket = null;
          detail.textContent = "아직 연결할 수 없습니다. 자동으로 재시도합니다.";
          schedule();
        };

        ws.onclose = function () {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          if (socket === ws) socket = null;
          schedule();
        };
      }

      retryButton.onclick = function () {
        attempt = 0;
        probe();
      };
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) probe();
      });
      probe();
    }());
  </script>
</body>
</html>
