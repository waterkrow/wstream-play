<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>wStream</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0d;color:#fff;font-family:system-ui,sans-serif}
#wrap{display:flex;flex-direction:column;width:100%;height:100%}
canvas{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;touch-action:none;display:block}
#bar{flex:0 0 62px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#000;padding:0 8px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
#nav{display:flex;align-items:center;gap:5px;justify-self:start}
#bar button{height:52px;min-width:57px;border:0;border-radius:11px;background:#1c2530;color:#eceff4;font-size:22px;line-height:1;padding:0;cursor:pointer}
#bar button:active{background:#2a3746}
#pins{display:flex;align-items:center;justify-content:center;gap:3px;overflow:hidden;justify-self:center}
#pins img{width:42px;height:42px;padding:4px;border-radius:11px;cursor:pointer}
#pins img:active{background:#2a3746}
#meta{font-size:16px;color:#cdd3de;white-space:nowrap;padding-right:5px;justify-self:end}
.status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#11151a;z-index:3;font-size:20px;white-space:pre-line;text-align:center;padding:24px}
.status.hide{display:none}
</style></head><body>
<div id="wrap">
  <canvas id="screen"></canvas>
  <div id="bar">
    <div id="nav">
      <button id="nav-back" title="뒤로">◀</button>
      <button id="nav-home" title="홈">●</button>
      <button id="nav-apps" title="앱">▦</button>
    </div>
    <div id="pins"></div>
    <div id="meta"></div>
  </div>
</div>
<div id="status" class="status">연결 중…</div>
<script src="app.js?v=20260919-2"></script></body></html>
